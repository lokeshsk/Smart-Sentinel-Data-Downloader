[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-sentinel-downloader"
version = "1.0.0"
description = "Fast, selective, and robust Sentinel-1 and Sentinel-2 data downloader for the Copernicus Data Space Ecosystem (CDSE)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Lokesh S K" }
]
keywords = [
    "copernicus",
    "sentinel",
    "sentinel-1",
    "sentinel-2",
    "earth-observation",
    "remote-sensing",
    "cdse",
    "satellite-imagery",
    "gis",
    "downloader",
    "stac"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.64.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3.0",
]
s3 = [
    "boto3>=1.28.0",
]
all = [
    "smart-sentinel-downloader[geo,s3]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
]

[project.scripts]
sentinel-dl = "smart_sentinel.cli:main"
smart-sentinel = "smart_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/lokeshsk/Smart-Sentinel-Data-Downloader"
Documentation = "https://lokeshsk.github.io/Smart-Sentinel-Data-Downloader/"
Repository = "https://github.com/lokeshsk/Smart-Sentinel-Data-Downloader.git"
Issues = "https://github.com/lokeshsk/Smart-Sentinel-Data-Downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["smart_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

